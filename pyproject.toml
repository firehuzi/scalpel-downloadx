[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "downloadx"
version = "0.2.0"
description = "刃研社-DownloadX：本地优先、无广告、可被 Agent 调用的下载器"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "刃研社 / SCALPEL LAB", email = "firehuzi@github.com" }]
keywords = ["downloader", "http", "resumable", "agent", "yt-dlp", "bilibili"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/firehuzi/scalpel-downloadx"
Issues = "https://github.com/firehuzi/scalpel-downloadx/issues"
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
downloadx = "downloadx.cli:main"

[tool.setuptools]
packages = ["downloadx", "downloadx.core", "downloadx.network", "downloadx.storage", "downloadx.queue", "downloadx.api"]

[tool.setuptools.package-data]
downloadx = ["ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
